<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toque — Panel de reseñas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <div class="logo">Toque<span>.</span></div>
        <div class="subtitulo">Panel de reseñas</div>
      </header>
      
      <p class="explicacion">Estas son las reseñas que ya llegaron a Google Maps. Toque las revisa y te avisa cuales necesitan tu atención. Tu decides si respondes o la reportas.</p>

      <section class="resumen" id="resumen"></section>

      <nav class="filtros" id="filtros">
        <button class="filtro activo" data-filtro="todas">Todas</button>
        <button class="filtro" data-filtro="alertadas">Alertadas</button>
        <button class="filtro" data-filtro="pendientes">Pendientes</button>
      </nav>

      <main class="lista" id="lista"></main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
