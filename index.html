<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toque — Panel de reseñas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0F2E1D" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <div class="logo">Toque<span>.</span></div>
        <div class="subtitulo">Panel de reseñas</div>
      </header>
      
      <p class="explicacion">Estas son las reseñas que ya llegaron a Google Maps. Toque las revisa y te avisa cuáles conviene <strong>reportar</strong> (ofensivas, discriminatorias o spam) y cuáles conviene <strong>responder</strong> (calificación baja). Tú decides qué hacer con cada una.</p>

      <div class="avisos" id="avisos" role="status"></div>

      <section class="resumen" id="resumen"></section>

      <nav class="filtros" id="filtros" aria-label="Filtrar reseñas">
        <button type="button" class="filtro activo" data-filtro="todas" aria-pressed="true" title="Ver todas las reseñas, buenas y malas">Todas <span class="cuenta"></span></button>
        <button type="button" class="filtro" data-filtro="reportar" aria-pressed="false" title="Reseñas ofensivas, discriminatorias o spam que puedes reportar a Google">Para reportar <span class="cuenta"></span></button>
        <button type="button" class="filtro" data-filtro="responder" aria-pressed="false" title="Reseñas con calificación baja que vale la pena responder">Para responder <span class="cuenta"></span></button>
        <button type="button" class="filtro" data-filtro="pendientes" aria-pressed="false" title="Reseñas que todavía no has reportado, respondido ni descartado">Pendientes <span class="cuenta"></span></button>
      </nav>

      <main class="lista" id="lista"></main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
